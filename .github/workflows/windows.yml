name: windows

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    # MinGW rather than MSVC. MSVC gets as far as compiling ffmpeg and then
    # fails inside its source, on constructs it does not accept, and patching
    # ffmpeg to suit us is not a road worth starting down. MinGW is what
    # ffmpeg's own Windows builds use, so it is the path with the fewest
    # surprises.
    #
    # That choice applies to everything: ffmpeg, x264, libcaption and Rust all
    # have to agree, since MinGW output cannot be linked by MSVC or the reverse.
    defaults:
      run:
        shell: msys2 {0}

    # rusty_ffmpeg's pkg-config support is compiled out on Windows, so it is
    # pointed at the directories instead and build.rs supplies the libraries
    # that pkg-config would otherwise have named.
    env:
      FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/third_party/ffmpeg/include
      FFMPEG_LIBS_DIR: ${{ github.workspace }}/third_party/ffmpeg/lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          # Inherited so the Rust toolchain installed below is reachable from
          # this shell.
          path-type: inherit
          install: >-
            make
            diffutils
            git
            curl
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: windows-gnu

      - name: Cache the static ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-mingw-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --target x86_64-pc-windows-gnu -- -D warnings

      - name: Test
        run: cargo test --no-default-features --target x86_64-pc-windows-gnu

      - name: Build release
        run: cargo build --release --no-default-features --target x86_64-pc-windows-gnu

      - name: Smoke test
        # Generating a fixture exercises the encoders, the muxer and the caption
        # paths, which a compile alone does not.
        run: |
          ./target/x86_64-pc-windows-gnu/release/fakestream.exe serve --port 8080 --quiet &
          sleep 3
          curl --fail --max-time 300 -o basic.mp4 http://localhost:8080/vod/basic.mp4
          test -s basic.mp4

      - name: Show why the build failed
        if: failure()
        run: |
          for log in third_party/ffmpeg/build/x264/config.log \
                     third_party/ffmpeg/build/ffmpeg-*/ffbuild/config.log; do
            [ -f "$log" ] && echo "=== $log ===" && tail -40 "$log"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fakestream-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/fakestream.exe
